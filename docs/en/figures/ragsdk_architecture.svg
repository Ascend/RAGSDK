  <text x="275" y="252" text-anchor="middle" fill="#64748b" font-size="11">Preserves document hierarchical structure</text>

  <rect x="20" y="268" width="510" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="275" y="291" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Multimodal understanding</text>
  <text x="275" y="308" text-anchor="middle" fill="#64748b" font-size="11">Image-text cross-modal semantic understanding</text>

  <rect x="20" y="324" width="510" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="275" y="347" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Document layout recognition</text>
  <text x="275" y="364" text-anchor="middle" fill="#64748b" font-size="11">Layout analysis and element positioning</text>

  <rect x="564" y="110" width="510" height="38" rx="8" fill="url(#stage)" filter="url(#shadow)"/>
  <text x="819" y="135" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Vectorization and reranking acceleration</text>

  <rect x="564" y="156" width="510" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="819" y="179" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Multimodal embedding models</text>
  <text x="819" y="196" text-anchor="middle" fill="#64748b" font-size="11">Text/Image cross-modal</text>

  <rect x="564" y="212" width="510" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="819" y="235" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Embedding models</text>
  <text x="819" y="252" text-anchor="middle" fill="#64748b" font-size="11">Local/TEI service-based dual-mode</text>

  <rect x="564" y="268" width="510" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="819" y="291" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Reranker models</text>
  <text x="819" y="308" text-anchor="middle" fill="#64748b" font-size="11">Fine-grained retrieval result ranking</text>

  <rect x="564" y="324" width="510" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="819" y="347" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Domain-specific fine-tuning</text>
  <text x="819" y="364" text-anchor="middle" fill="#64748b" font-size="11">Embedding domain adaptation</text>

  <rect x="20" y="400" width="1050" height="38" rx="8" fill="url(#stage)" filter="url(#shadow)"/>
  <text x="545" y="425" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Knowledge base management and high-performance high-accuracy retrieval</text>

  <rect x="20" y="446" width="340" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="190" y="469" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Knowledge graph management</text>
  <text x="190" y="486" text-anchor="middle" fill="#64748b" font-size="11">Entity/Relation extraction and storage</text>

  <rect x="375" y="446" width="340" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="545" y="469" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Hybrid retrieval</text>
  <text x="545" y="486" text-anchor="middle" fill="#64748b" font-size="11">Vector + BM25 multi-way fusion</text>

  <rect x="730" y="446" width="340" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="900" y="469" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Multimodal retrieval</text>
  <text x="900" y="486" text-anchor="middle" fill="#64748b" font-size="11">Text/Image/Table cross-modal recall</text>

  <rect x="20" y="504" width="520" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="280" y="527" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Vector databases</text>
  <text x="280" y="544" text-anchor="middle" fill="#64748b" font-size="10">OpenGauss/Faiss/Milvus</text>

  <rect x="550" y="504" width="520" height="50" rx="8" fill="url(#cardBlue)" filter="url(#shadowSm)" stroke="#dbeafe" stroke-width="1"/>
  <text x="810" y="527" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Graph databases</text>
  <text x="810" y="544" text-anchor="middle" fill="#64748b" font-size="10">OpenGauss/NetworkX</text>

  <rect x="20" y="572" width="1060" height="26" rx="6" fill="url(#stack)" filter="url(#shadowSm)"/>
  <text x="40" y="590" fill="#1e40af" font-size="13" font-weight="bold">Inference engines</text>
  <text x="540" y="590" text-anchor="middle" fill="#1e40af" font-size="13">MindIE/vLLM-Ascend</text>

  <rect x="20" y="604" width="1060" height="26" rx="6" fill="url(#stack)" filter="url(#shadowSm)"/>
  <text x="40" y="622" fill="#1e40af" font-size="13" font-weight="bold">CANN</text>
  <text x="540" y="622" text-anchor="middle" fill="#1e40af" font-size="13">Heterogeneous computing architecture</text>

  <rect x="20" y="636" width="1060" height="26" rx="6" fill="url(#stack)" filter="url(#shadowSm)"/>
  <text x="40" y="654" fill="#1e40af" font-size="13" font-weight="bold">Ascend/Kunpeng hardware</text>
  <text x="540" y="654" text-anchor="middle" fill="#1e40af" font-size="13">Ascend 310 | Ascend 910</text>

  <rect x="20" y="670" width="1060" height="26" rx="8" fill="url(#footerBg)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="688" text-anchor="end" fill="#1e40af" font-size="13" font-weight="bold">Built for Ascend NPU</text>
  <circle cx="415" cy="683" r="2.5" fill="#94a3b8"/>
  <text x="520" y="688" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Modular APIs</text>
  <circle cx="600" cy="683" r="2.5" fill="#94a3b8"/>
  <text x="615" y="688" text-anchor="start" fill="#1e40af" font-size="13" font-weight="bold">Embedding model acceleration</text>
</svg>