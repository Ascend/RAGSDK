on:
  workflow_call:
    inputs:
      REMOTE_URL:
        required: false
        type: string
        default: ${{ atomgit.repositoryurl }}
      pr_id:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.number }}
      IMAGE_FLAG:
        required: true
        type: string
        description: "Full SWR image URL, e.g. swr.<region>.<org>/mindx_arm:tag"
      TARGET_BRANCH:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.base.ref }}
      runs_on_arch:
        required: true
        type: string
        description: "x86 or arm"
      servicename:
        required: false
        type: string
        default: $(echo "${{ atomgit.repository }}" | cut -d '/' -f 2)
      DEFAULT_BRANCH:
        required: false
        type: string
        default: "master"

jobs:
  JOB_compile:
    name: JOB_compile
    select: selected_by_default
    runs-on: [ self-hosted, "${{ inputs.runs_on_arch }}", cpu=32 ]
    container:
      image: ${{ inputs.IMAGE_FLAG }}
      options: --user root
    steps:
      - name: clone repo and merge PR
        run: |
          set -x
          servicename=$(echo "${{ atomgit.repository }}" | cut -d '/' -f 2)
          git clone --no-tags --single-branch -b ${{ inputs.TARGET_BRANCH }} ${{ inputs.REMOTE_URL }} ${{ inputs.servicename }}
          cd ${{ inputs.servicename }}

          git fetch --no-tags origin refs/merge-requests/${{ inputs.pr_id }}/head:pr_${{ inputs.pr_id }}
          git reset --hard "origin/${{ inputs.TARGET_BRANCH }}"
          git checkout -b new_${{ inputs.TARGET_BRANCH }}
          git config --global user.name AtlasAccount
          git config --global user.email AtlasAccount@noreply.gitcode.com
          git merge --no-edit pr_${{ inputs.pr_id }}
          git diff-tree -r --name-only --no-commit-id origin/${{ inputs.TARGET_BRANCH }} HEAD > ${ATOMGIT_WORKSPACE}/change.txt
          cat ${ATOMGIT_WORKSPACE}/change.txt

          if [ "${{ inputs.TARGET_BRANCH }}" != "${{ inputs.DEFAULT_BRANCH }}" ]; then
              mkdir -p .gitcode/workflows
              git clone --no-tags --single-branch --depth 1 -b ${{ inputs.DEFAULT_BRANCH }} ${{ inputs.REMOTE_URL }} ${ATOMGIT_WORKSPACE}/tempdir
              cp -fr ${ATOMGIT_WORKSPACE}/tempdir/.gitcode/workflows/scripts .gitcode/workflows/ 2>/dev/null || true
              cp -fr ${ATOMGIT_WORKSPACE}/tempdir/.gitcode/workflows/config .gitcode/workflows/ 2>/dev/null || true
              rm -fr ${ATOMGIT_WORKSPACE}/tempdir
          fi

      - name: prepare_dependency
        run: |
          set -e
          echo "ATOMGIT_WORKSPACE=${ATOMGIT_WORKSPACE}"
          echo "servicename=${{ inputs.servicename }}"

          cd ${ATOMGIT_WORKSPACE}/${{ inputs.servicename }}/
          mkdir opensource
          cd opensource
          apt-get -y install dos2unix
          pip3 list
          pip3 install torch-npu==2.1.0.post12
          git clone https://gitcode.com/cann-src-third-party/makeself.git
          cp makeself/makeself-2.5.0.patch ./
          rm -rf makeself
          git clone -b v3.11.3 https://gitcode.com/GitHub_Trending/js/json.git
          git clone -b release-2.5.0 https://gitcode.com/gh_mirrors/ma/makeself.git makeself-release-2.5.0


      - name: compile
        run: |
          set -ex
          artifact_directory="${ATOMGIT_WORKSPACE}/artifacts"
          mkdir -p "${artifact_directory}"
          touch "${artifact_directory}/empty.run"
          touch "${artifact_directory}/empty.whl"

          cd ${ATOMGIT_WORKSPACE}/${{ inputs.servicename }}/build && chmod +x *.sh
          export CC=/opt/rh/devtoolset-index/root/usr/bin/gcc
          export CXX=/opt/rh/devtoolset-index/root/usr/bin/g++
          export GCC_HOME=/opt/rh/devtoolset-index/root/usr/
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          ./build.sh

          cp -p -f -r ${ATOMGIT_WORKSPACE}/${{ inputs.servicename }}/output/Ascend-mindxsdk-mxrag*.run "${artifact_directory}/"
          cp -p -f -r ${ATOMGIT_WORKSPACE}/${{ inputs.servicename }}/output/mx_rag*.whl "${artifact_directory}/"

      - name: Upload artifact
        uses: upload-artifact
        with:
          name: ${{ atomgit.repository }}-${{ inputs.runs_on_arch }}
          path: |
            artifacts/*
          overwrite: true
